name: Avisos diarios
on:
  schedule:
    - cron: '50 9 * * *'   # 6h50 em Brasilia (o GitHub costuma atrasar alguns minutos)
    - cron: '40 8 * * *'   # 5h40 em Brasilia: so o aviso do Lactotropin no dia da aplicacao
  workflow_dispatch:
    inputs:
      teste:
        description: 'Mandar aviso de teste agora'
        type: boolean
        default: true
      data:
        description: 'Simular uma data (dd/mm/aaaa), so para teste'
        required: false
        default: ''
      modo:
        description: 'normal = aviso das 7h; lacto = aviso das 6h do Lactotropin'
        required: false
        default: 'normal'
      mensagem:
        description: 'Recado livre (se preencher, manda só este texto)'
        required: false
        default: ''
      pagina:
        description: 'Página que abre ao tocar no recado (ex.: lactotropin.html)'
        required: false
        default: ''
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node avisar.js
        env:
          VAPID_PUBLICA: BMo96EQtufIs-vg4sDDIBWDQuaDr5kEUqqvjPc8U19JUFKmJJerboaepEKSy7wzeAUgOIipC3BoAWq0dPxUgbB0
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          # um celular por linha extra: crie o secret ASSINATURAS_3, _4... e acrescente aqui
          ASSINATURAS: ${{ secrets.ASSINATURAS }} ${{ secrets.ASSINATURAS_3 }} ${{ secrets.ASSINATURAS_4 }} ${{ secrets.ASSINATURAS_5 }}
          HOJE: ${{ github.event_name == 'workflow_dispatch' && inputs.data || '' }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MENSAGEM: ${{ github.event_name == 'workflow_dispatch' && inputs.mensagem || '' }}
          PAGINA: ${{ github.event_name == 'workflow_dispatch' && inputs.pagina || '' }}
          MODO: ${{ github.event.schedule == '40 8 * * *' && 'lacto' || inputs.modo || 'normal' }}
